name: mytracker

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Set the Supabase DATABASE_URL in .env.production}
      DATABASE_SSL: "${DATABASE_SSL:?Set DATABASE_SSL=true in .env.production}"
      DATABASE_SSL_CA: /app/TrackerWebApp/Server/certs/supabase-ca.crt
      PUBLIC_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
      FRONTEND_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
      CORS_ORIGINS: https://${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      TRUST_PROXY_HOPS: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ALLOW_DEMO_SEED: "false"
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 20s
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  caddy_data:
  caddy_config:
