name: mytracker
x-api: &api
  build: .
  environment: &environment
    NODE_ENV: ${NODE_ENV:-development}
    HOST: 0.0.0.0
    PORT: 3000
    DATABASE_URL: postgresql://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-tracker}
    PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
    LOG_LEVEL: ${LOG_LEVEL:-info}
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tracker}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - tracker_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
  migrate:
    <<: *api
    command: ["node", "dist/db/cli.js", "migrate"]
    depends_on:
      db: { condition: service_healthy }
  api:
    <<: *api
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  tracker_data:
