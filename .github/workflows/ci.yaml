name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tracker_test
          POSTGRES_PASSWORD: tracker_test_password
          POSTGRES_DB: tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracker_test -d tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      TEST_DATABASE_URL: postgresql://tracker_test:tracker_test_password@127.0.0.1:5432/tracker_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            TrackerWebApp/Client/package-lock.json
            TrackerWebApp/Server/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix TrackerWebApp/Server

      - name: Install frontend dependencies
        run: npm ci --prefix TrackerWebApp/Client

      - name: Check and test backend
        run: |
          npm run typecheck --prefix TrackerWebApp/Server
          npm test --prefix TrackerWebApp/Server
          npm run build --prefix TrackerWebApp/Server

      - name: Build frontend
        run: npm run build --prefix TrackerWebApp/Client

      - name: Install Playwright Chromium
        run: npx --prefix TrackerWebApp/Client playwright install --with-deps chromium

      - name: Test frontend
        run: npm test --prefix TrackerWebApp/Client

      - name: Build production container
        run: docker build --tag mytracker:ci .

      - name: Validate production deployment files
        run: |
          bash -n deploy/*.sh
          docker compose --env-file .env.production.example -f compose.production.yaml config --quiet
